# ======================================================
# CONFIG for non-dataset specific configuration options
# ======================================================

# ------------------------------------------
# General IO
# ------------------------------------------

path_to_cffdrs_ng: "/users/rpayne/cffdrs-ng"            # Computes hourly FWIs
path_to_cffdrs_py: "/users/rpayne/cffdrs_py"            # Computes daily FWIs
path_to_location_parameters: "/path/to/input.csv"       # Path to CSV file containing lat/lons to calculate FWIs for, and other info as detailed in the README
output_directory: "/path/to/output"
lazy_load_data: false

# ------------------------------------------
# General dataset and location information
# ------------------------------------------

dataset_name: "era5"
cffwis_version: "FWI2025"     # choose from ["FWI1987", "FWI2025"]
start_year: 2000              # must fall within the dataset's time range
final_year: null
latitude: 48.2
longitude: 236.64             # must be consistent with longitude range defined in [dataset].yaml
output_vars:                  # see valid_output_variables.txt
  - "MASK"
  - "WS"
  - "FWI"
  - "BUI"

# ------------------------------------------
# FWI calculation & overwintering
# ------------------------------------------

FFMC_default: 85.0
DMC_default: 6.0
DC_default: 15.0
season_consecutive_days: 3
season_start_temp: 12.0
season_stop_temp: 5.0

overwinter: false
carry_over_fraction: 1.0
wetting_efficiency_fraction: 0.75
