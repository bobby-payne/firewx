# ======================================================
# CONFIG for non-dataset specific configuration options
# ======================================================

# ------------------------------------------
# General IO
# ------------------------------------------

path_to_location_parameters: "/sapho/rpayne/firewx/example.csv"       # Path to CSV file containing lat/lons to calculate FWIs for, and other info as detailed in the README
output_directory: "/path/to/output"
lazy_load_data: false

# ------------------------------------------
# General dataset and location information
# ------------------------------------------

dataset_name: "era5"
cffwis_version: "FWI2025"     # choose from ["FWI1987", "FWI2025"]
crop:                         # crop dataset to [start_year, final_year].
  start_year: null
  final_year: null
output_vars:                  # see valid_output_variables.txt
  - "MASK"
  - "WS"
  - "FWI"
  - "BUI"

# ------------------------------------------
# FWI calculation & overwintering
# ------------------------------------------

FFMC_default: 85.0
DMC_default: 6.0
DC_default: 15.0
season_consecutive_days: 3
season_start_temp: 12.0
season_stop_temp: 5.0

overwinter: false
carry_over_fraction: 1.0
wetting_efficiency_fraction: 0.75
