# ======================================================
# CONFIG for dataset-specific configuration options
# ======================================================


# ------------------------------------------
# Dataset dimensions and coordinates
# ------------------------------------------

time_coordinate_name: "time"
longitude_coordinate_name: "longitude"
latitude_coordinate_name: "latitude"

# ------------------------------------------
# Conventions
# ------------------------------------------

longitude_convention: [0, 360]          # choose from [-180, 180] or [0, 360]
timezone: "UTC"                         # choose from: "UTC", "LST"

# ------------------------------------------
# Dask chunking (only used if lazy loading)
# ------------------------------------------

chunks:
    time: -1
    longitude: 20
    latitude: 20

# ------------------------------------------
# Weather variables
# ------------------------------------------

wind_speed_10m:

  path: "/home/rpayne/data-rpayne/unproc/ERA5/SFCWIND/sfcWind_200001_200112_debug.nc"
  variable_name: 'sfcWind'
  units: "m/s"        # choose from: "m/s", "km/h", "mph", "kts"
  transform: null

air_temperature_2m:

  path: "/home/rpayne/data-rpayne/unproc/ERA5/TAS/tas_200001_200112_debug.nc"
  variable_name: 'tas'
  units: "K"          # choose from: "K", "C", "F"
  transform: null

relative_humidity_2m:

  path: "/home/rpayne/data-rpayne/unproc/ERA5/RH/merged/RH_200001_200112_debug.nc"
  variable_name: 'rh'
  units: "%"          # choose from: "%" or null
  transform: null

precip_accumulation_1hr:

  path: "/home/rpayne/data-rpayne/unproc/ERA5/PREC/merged/PREC_200001_200112_debug.nc"
  variable_name: 'pr'
  units: "mm"         # choose from: "mm", "cm", "in"
  transform: "x * 3600"
