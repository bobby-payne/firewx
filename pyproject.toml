[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firewx"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "xarray>=2026.9.0",
    "pyyaml>=6.0.3",
    "pytz>=2026.6",
    "timezonefinder>=9.2.0",
    "haversine>=2.9.0",
    "cffdrs @ git+https://github.com/cffdrs/cffdrs_py@2480d4351e7f63efd3060c4ef5afc86b19cd3d74",
    "cffdrs-ng @ git+https://github.com/bobby-payne/cffdrs-ng"
]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
firewx = "firewx.cli:main"

[project.optional-dependencies]
dev = [
    "matplotlib>=3.11.2",
    "ipykernel>=7.4.0",
]